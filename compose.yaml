services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: urpoint
      POSTGRES_USER: urpoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urpoint -d urpoint"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-urpoint}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-urpoint_minio_dev}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-urpoint} $${MINIO_ROOT_PASSWORD:-urpoint_minio_dev}; do
        echo 'waiting for minio...';
        sleep 1;
      done;
      mc mb --ignore-existing local/$${MINIO_BUCKET:-urpoint};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-urpoint}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-urpoint_minio_dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-urpoint}
    restart: "no"

volumes:
  postgres_data:
  minio_data:
